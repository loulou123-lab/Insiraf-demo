<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#116b63"><title>انصراف آمن | تجربة الجوال</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#18302e;background:#f3f7f6}*{box-sizing:border-box}body{margin:0}header{background:#116b63;color:white;padding:22px 18px 20px}header h1{margin:0;font-size:25px}header p{margin:7px 0 0;font-size:13px;opacity:.9}.wrap{max-width:680px;margin:auto;padding:16px}.notice{background:#fff5dc;border:1px solid #ebd6a0;padding:12px;border-radius:12px;font-size:13px;line-height:1.7}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:15px 0}.tabs button{font-size:12px;padding:11px 2px;background:white;color:#116b63;border:1px solid #c9ddda}.tabs button.active{background:#116b63;color:white}.card{background:white;border:1px solid #dae7e4;border-radius:17px;padding:17px;margin:13px 0;box-shadow:0 2px 8px #1233}.muted{color:#607774;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{background:#e1f4e8;color:#14613c;border-radius:40px;padding:5px 10px;font-size:12px;font-weight:700}.warn{background:#fff0d2;color:#8b5900}.btn,button{font:inherit;cursor:pointer;border-radius:10px;border:0;padding:12px 15px}.btn{background:#116b63;color:#fff;width:100%;font-weight:700;margin-top:10px}.btn:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e6efed;color:#174c47}.danger{background:#ffe7e7;color:#8a2525}input,select{width:100%;padding:12px;border:1px solid #bed4d0;border-radius:10px;font:inherit;background:white;margin:6px 0 12px}label{font-size:13px;font-weight:650}h2{font-size:20px;margin:5px 0 12px}h3{font-size:16px;margin:8px 0}p{line-height:1.7}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#eff6f4;border-radius:12px;padding:12px 7px;text-align:center}.stat strong{display:block;font-size:24px}.stat small{font-size:11px;color:#59716d}.timeline{display:flex;flex-wrap:wrap;gap:6px}.timeline span{background:#eff6f4;border-radius:20px;padding:7px 10px;font-size:12px}.hide{display:none}.footer{color:#68817d;font-size:12px;text-align:center;padding:18px}.message{white-space:pre-line;background:#e8f7ec;padding:14px;border-radius:12px;font-size:14px;line-height:1.8}a{color:#116b63}input[type=range]{padding:0}button:focus-visible,input:focus-visible{outline:3px solid #e2a835} @media(max-width:350px){.tabs button{font-size:11px}}
</style></head><body><header><h1>🛡️ انصراف آمن</h1><p id="schoolName">المدرسة التجريبية • تجربة من الجوال</p></header><main class="wrap"><div class="notice">🧪 <strong>نسخة عرض فقط:</strong> جميع الأسماء والطلبات وهمية. لا توجد رسائل واتساب أو SMS فعلية، ولا مشاركة بيانات مع خادم. التغييرات محفوظة في هذا المتصفح فقط، ولا تظهر على جهاز آخر.</div><nav class="tabs" aria-label="الأدوار"><button data-tab="parent" class="active">ولي الأمر</button><button data-tab="supervisor">المشرفة</button><button data-tab="gate">البوابة</button><button data-tab="admin">الإدارة</button></nav><section id="view" aria-live="polite"></section><div class="footer">نسخة تجريبية تعليمية — ليست مخصصة لانصراف طالبات حقيقيات</div></main><script>
const KEY='insiraf-demo-v2';const initial=()=>({school:'المدرسة التجريبية',radius:300,distance:180,student:'نورة أحمد',grade:'الرابع / أ',guardian:'أحمد',status:'idle',events:[],verified:false});let s;try{s={...initial(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s=initial()}let tab='parent';const $=id=>document.getElementById(id);const save=()=>{localStorage.setItem(KEY,JSON.stringify(s));render()};const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names={idle:'لا يوجد طلب',requested:'طلب جديد',preparing:'جاري التجهيز',ready:'جاهزة للاستلام',completed:'تم التسليم'};const within=()=>Number(s.distance)<=Number(s.radius);const note=t=>{s.events.unshift(new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'})+' — '+t);s.events=s.events.slice(0,12)};const badge=()=>`<span class="badge ${s.status==='requested'?'warn':''}">${names[s.status]}</span>`;const log=()=>s.events.length?`<div class="card"><h3>سجل الأحداث</h3><div class="timeline">${s.events.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>`:'';
function render(){ $('schoolName').textContent=s.school+' • تجربة من الجوال';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let h='';if(tab==='parent'){h=`<div class="card"><h2>بوابة ولي الأمر</h2><p class="muted">حساب تجريبي — تسجيل الدخول برمز OTP ممثّل فقط</p><div class="row"><div><strong>${esc(s.student)}</strong><div class="muted">${esc(s.grade)}</div></div><span class="badge">مستلم مخوّل (تجريبي)</span></div></div><div class="card"><h3>التحقق من قرب المدرسة</h3><p class="muted">حركي المؤشر لمحاكاة المسافة، ولا تُستخدم إحداثيات هاتفك في هذه النسخة.</p><label for="distance">المسافة: <strong>${s.distance} متر</strong></label><input id="distance" type="range" min="0" max="700" step="10" value="${s.distance}"><div class="row"><span class="muted">النطاق المسموح: ${s.radius} متر</span><span class="badge ${within()?'':'warn'}">${within()?'داخل النطاق':'خارج النطاق'}</span></div><button class="btn" id="request" ${!within()||s.status!=='idle'?'disabled':''}>إرسال طلب الانصراف</button></div><div class="card"><h3>حالة الطالبة</h3>${badge()}<p class="muted">تُحدّث المشرفة الحالة من تبويب المشرفة.</p></div>`}
if(tab==='supervisor'){h=`<h2>لوحة المشرفة</h2><div class="statgrid"><div class="stat"><strong>${s.status==='requested'?1:0}</strong><small>جديدة</small></div><div class="stat"><strong>${s.status==='preparing'?1:0}</strong><small>قيد التجهيز</small></div><div class="stat"><strong>${s.status==='ready'?1:0}</strong><small>جاهزة</small></div></div><div class="card"><div class="row"><h3>${esc(s.student)}</h3>${badge()}</div><p class="muted">${esc(s.grade)} — ولي الأمر: ${esc(s.guardian)}</p>${s.status==='idle'?'<p>لا توجد طلبات. أرسلي طلبًا من تبويب ولي الأمر.</p>':''}${s.status==='requested'?'<button class="btn" id="prepare">بدء التجهيز</button>':''}${s.status==='preparing'?'<button class="btn" id="ready">الطالبة جاهزة للاستلام</button>':''}${s.status==='ready'?'<p>بانتظار تأكيد التسليم من مسؤولة البوابة.</p>':''}${s.status==='completed'?'<p>✓ تم تسجيل التسليم.</p>':''}</div><div class="card"><h3>معاينة إشعار واتساب</h3><div class="message">🔔 انصراف آمن\n${s.status==='idle'?'لم يصدر طلب بعد.':`طلب انصراف للطالبة: ${esc(s.student)}\nالصف: ${esc(s.grade)}\nالحالة: ${names[s.status]}`}</div><p class="muted">معاينة فقط — لم تُرسل رسالة فعلية.</p></div>`}
if(tab==='gate'){h=`<div class="card"><h2>مسؤولة بوابة الاستلام</h2><div class="row"><strong>${esc(s.student)}</strong>${badge()}</div><p class="muted">المستلم المخوّل التجريبي: ${esc(s.guardian)}</p><label><input id="verified" type="checkbox" style="width:auto;margin-left:8px" ${s.verified?'checked':''}>تم التحقق حضوريًا من هوية المستلم المخوّل (محاكاة)</label><button class="btn" id="complete" ${s.status!=='ready'||!s.verified?'disabled':''}>تأكيد تسليم الطالبة</button><p class="muted">في التشغيل الحقيقي، يجب تطبيق إجراء تحقق معتمد من المدرسة، لا مجرد تحديد مربع.</p></div>`}
if(tab==='admin'){h=`<div class="card"><h2>إدارة المدرسة</h2><label for="school">اسم المدرسة التجريبي</label><input id="school" maxlength="80" value="${esc(s.school)}"><label for="radius">نطاق السماح</label><select id="radius">${[100,200,300,400,500].map(x=>`<option value="${x}" ${s.radius==x?'selected':''}>${x} متر</option>`).join('')}</select><button class="btn" id="saveadmin">حفظ الإعدادات</button></div><div class="statgrid"><div class="stat"><strong>1</strong><small>طالبة وهمية</small></div><div class="stat"><strong>1</strong><small>ولي أمر وهمي</small></div><div class="stat"><strong>${s.status==='idle'?0:1}</strong><small>طلبات التجربة</small></div></div><div class="card"><h3>إعادة ضبط التجربة</h3><p class="muted">حذف حالة الطلبات والإعدادات التجريبية من هذا المتصفح.</p><button class="btn danger" id="reset">إعادة ضبط جميع البيانات</button></div>`} $('view').innerHTML=h+log();bind()}
function changeStatus(next,message){s.status=next;note(message);save()}
function bind(){if($('distance'))$('distance').oninput=e=>{s.distance=+e.target.value;save()};if($('request'))$('request').onclick=()=>{if(!within()||s.status!=='idle')return;changeStatus('requested','طلب ولي الأمر الانصراف')};if($('prepare'))$('prepare').onclick=()=>changeStatus('preparing','المشرفة بدأت التجهيز');if($('ready'))$('ready').onclick=()=>changeStatus('ready','الطالبة جاهزة للاستلام');if($('verified'))$('verified').onchange=e=>{s.verified=e.target.checked;save()};if($('complete'))$('complete').onclick=()=>{if(s.status==='ready'&&s.verified)changeStatus('completed','تم التسليم التجريبي')};if($('saveadmin'))$('saveadmin').onclick=()=>{s.school=$('school').value.trim()||'المدرسة التجريبية';s.radius=+$('radius').value;note('تحديث إعدادات المدرسة');save()};if($('reset'))$('reset').onclick=()=>{if(confirm('هل تريدين حذف جميع بيانات التجربة؟')){s=initial();save()}}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
